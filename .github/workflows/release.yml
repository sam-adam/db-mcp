name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  classify:
    name: Validate release channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: channel
        name: Require a valid tag on its release branch
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            branch=develop
            prerelease=true
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            branch=main
            prerelease=false
          else
            echo "Tag must be vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          git fetch origin "$branch"
          git merge-base --is-ancestor "$SHA" "origin/$branch"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true
          cache: true
      - name: Verify source
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          go vet ./...
          go test -race ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="db-mcp_${VERSION}_${os}_${arch}"
            mkdir -p "stage/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "stage/${name}/db-mcp" ./cmd/db-mcp
            tar -C stage -czf "dist/${name}.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.classify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" dist/* --title "db-mcp $TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" dist/* --title "db-mcp $TAG" --generate-notes
          fi
