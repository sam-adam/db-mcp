name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true
          cache: true
      - name: Build archive
        env:
          CHANNEL: ${{ github.ref_name == 'develop' && 'rc' || 'stable' }}
        run: |
          set -eu
          name="db-mcp_${CHANNEL}_${GITHUB_SHA::7}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "stage/${name}" dist
          CGO_ENABLED=0 GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' go build -trimpath -ldflags='-s -w' -o "stage/${name}/db-mcp" ./cmd/db-mcp
          tar -C stage -czf "dist/${name}.tar.gz" "$name"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.sha256"
      - name: Upload branch build
        uses: actions/upload-artifact@v4
        with:
          name: db-mcp-${{ github.ref_name == 'develop' && 'rc' || 'stable' }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
