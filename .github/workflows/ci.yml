name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath -ldflags='-s -w' -o dist/db-mcp ./cmd/db-mcp
      - name: Upload release-candidate build
        if: matrix.go == '1.22.x' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: db-mcp-rc-linux-amd64
          path: |
            dist/db-mcp
            coverage.out
          if-no-files-found: error
      - name: Upload stable build
        if: matrix.go == '1.22.x' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: db-mcp-stable-linux-amd64
          path: |
            dist/db-mcp
            coverage.out
          if-no-files-found: error
